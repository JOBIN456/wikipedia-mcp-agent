<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikipedia AI Assistant</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 90%;
            max-width: 900px;
            height: 90vh;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */

        .chat-header {
            padding: 20px 24px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 42px;
            height: 42px;
            background: #111827;
            color: white;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 23px;
            font-weight: bold;
        }

        .header-text h2 {
            font-size: 18px;
            color: #111827;
        }

        .header-text p {
            font-size: 13px;
            color: #6b7280;
            margin-top: 4px;
        }

        /* Chat messages */

        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .message {
            display: flex;
            max-width: 75%;
        }

        .message.user {
            align-self: flex-end;
        }

        .message.bot {
            align-self: flex-start;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.5;
            font-size: 15px;
            white-space: pre-wrap;
        }

        .user .bubble {
            background: #111827;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot .bubble {
            background: #f1f3f7;
            color: #1f2937;
            border-bottom-left-radius: 4px;
        }

        /* Welcome */

        .welcome {
            text-align: center;
            margin: auto;
            color: #6b7280;
        }

        .welcome h1 {
            color: #111827;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .welcome p {
            font-size: 14px;
        }

        /* Input */

        .chat-input-area {
            padding: 16px 20px;
            border-top: 1px solid #e5e7eb;
            background: white;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f5f6f8;
            border: 1px solid #e1e4e8;
            border-radius: 12px;
            padding: 6px;
        }

        #message-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            padding: 12px;
            font-size: 15px;
        }

        #send-button {
            border: none;
            background: #111827;
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 18px;
            transition: 0.2s;
        }

        #send-button:hover {
            background: #374151;
        }

        #send-button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        /* Loading */

        .typing {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .typing span {
            width: 6px;
            height: 6px;
            background: #6b7280;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-5px);
            }
        }

        /* Mobile */

        @media (max-width: 600px) {

            body {
                align-items: stretch;
            }

            .chat-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }

            .message {
                max-width: 85%;
            }

            .chat-messages {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

<div class="chat-container">

    <!-- Header -->
    <div class="chat-header">

        <div class="logo">
            W
        </div>

        <div class="header-text">
            <h2>Wikipedia AI</h2>
            <p>Powered by Groq + MCP</p>
        </div>

    </div>


    <!-- Messages -->
    <div class="chat-messages" id="chat-messages">

        <div class="welcome" id="welcome">
            <h1>Wikipedia AI Assistant</h1>
            <p>Ask me anything and I'll search Wikipedia for you.</p>
        </div>

    </div>


    <!-- Input -->
    <div class="chat-input-area">

        <div class="input-wrapper">

            <input
                type="text"
                id="message-input"
                placeholder="Ask something..."
                autocomplete="off"
            >

            <button id="send-button">
                ➤
            </button>

        </div>

    </div>

</div>


<script>

    const input = document.getElementById("message-input");
    const sendButton = document.getElementById("send-button");
    const chatMessages = document.getElementById("chat-messages");
    const welcome = document.getElementById("welcome");


    function addMessage(text, type) {

        if (welcome) {
            welcome.remove();
        }

        const message = document.createElement("div");

        message.classList.add("message", type);

        const bubble = document.createElement("div");

        bubble.classList.add("bubble");

        bubble.textContent = text;

        message.appendChild(bubble);

        chatMessages.appendChild(message);

        chatMessages.scrollTop = chatMessages.scrollHeight;

        return message;
    }


    function addTyping() {

        if (welcome) {
            welcome.remove();
        }

        const message = document.createElement("div");

        message.classList.add("message", "bot");

        message.id = "typing-message";

        message.innerHTML = `
            <div class="bubble typing">
                <span></span>
                <span></span>
                <span></span>
            </div>
        `;

        chatMessages.appendChild(message);

        chatMessages.scrollTop = chatMessages.scrollHeight;
    }


    function removeTyping() {

        const typing = document.getElementById("typing-message");

        if (typing) {
            typing.remove();
        }
    }


    async function sendMessage() {

        const message = input.value.trim();

        if (!message) {
            return;
        }

        addMessage(message, "user");

        input.value = "";

        sendButton.disabled = true;

        addTyping();

        try {

            const response = await fetch("/chat", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: message
                })

            });


            if (!response.ok) {
                throw new Error("Server error");
            }


            const data = await response.json();

            removeTyping();

            addMessage(data.response, "bot");


        } catch (error) {

            removeTyping();

            addMessage(
                "Sorry, something went wrong. Please try again.",
                "bot"
            );

            console.error(error);

        } finally {

            sendButton.disabled = false;

            input.focus();

        }
    }


    sendButton.addEventListener("click", sendMessage);


    input.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    });


    input.focus();

</script>

</body>
</html>
